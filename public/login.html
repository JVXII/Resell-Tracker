<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resell Tracker – Login</title>
  <link rel="icon" type="image/svg+xml" href="/resell_tracker_icon.svg">
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#000;--surface:#0c0c0d;--icon-bg:#1a1a1c;
      --hairline:rgba(255,255,255,0.08);
      --text:#f6f6f7;--dim:#8e8e93;--faint:#5b5b60;--green:#32d74b;
    }
    *{box-sizing:border-box;margin:0;padding:0;}
    body{
      background:var(--bg);
      color:var(--text);
      font-family:'Satoshi',-apple-system,sans-serif;
      display:flex;align-items:center;justify-content:center;
      min-height:100vh;padding:20px;
      -webkit-font-smoothing:antialiased;
      position:relative;overflow:hidden;
    }
    /* subtle ambient glow */
    body::before{
      content:'';position:fixed;top:-30%;left:50%;transform:translateX(-50%);
      width:680px;height:680px;border-radius:50%;
      background:radial-gradient(circle,rgba(50,215,75,0.10),transparent 62%);
      filter:blur(20px);pointer-events:none;
    }
    .card{
      position:relative;
      background:linear-gradient(180deg,#0e0e10,#080809);
      border:1px solid var(--hairline);
      border-radius:28px;
      padding:46px 38px 34px;
      text-align:center;
      width:380px;max-width:100%;
      box-shadow:0 40px 100px rgba(0,0,0,0.7);
      animation:rise .6s cubic-bezier(.2,.7,.3,1) both;
    }
    @keyframes rise{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:none;}}
    .logo-wrap{
      width:74px;height:74px;margin:0 auto 22px;
      border-radius:22px;background:var(--icon-bg);
      border:1px solid var(--hairline);
      display:flex;align-items:center;justify-content:center;
    }
    .logo{width:42px;height:42px;}
    .brand{font-size:25px;font-weight:900;letter-spacing:-0.03em;margin-bottom:10px;}
    .brand span{color:var(--green);}
    p{color:var(--dim);font-size:14px;margin-bottom:30px;line-height:1.55;font-weight:500;}
    .discord-btn{
      display:inline-flex;align-items:center;gap:10px;
      background:var(--text);color:#000;
      border:none;border-radius:14px;
      padding:15px 24px;font-size:15px;font-weight:700;
      cursor:pointer;text-decoration:none;width:100%;justify-content:center;
      transition:transform .15s,box-shadow .2s;
      font-family:inherit;
    }
    .discord-btn:hover{transform:translateY(-1px);box-shadow:0 12px 30px rgba(255,255,255,0.12);}
    .discord-btn:active{transform:translateY(0);}
    .discord-btn svg{width:21px;height:21px;flex-shrink:0;}
    .footer-note{margin-top:24px;color:var(--faint);font-size:12px;font-weight:500;}
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-wrap">
      <img src="/resell_tracker_icon.svg" alt="Logo" class="logo">
    </div>
    <div class="brand">Resell<span>.</span>Tracker</div>
    <p>Melde dich mit Discord an, um deine Artikel zu verwalten.</p>
    <a href="/auth/discord" class="discord-btn">
      <svg viewBox="0 0 127.14 96.36" fill="currentColor">
        <path d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21h0A105.73,105.73,0,0,0,32.71,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a75.57,75.57,0,0,0,64.32,0c.87.71,1.76,1.39,2.66,2a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.89,11.1A105.25,105.25,0,0,0,126.6,80.22h0C129.24,52.84,122.09,29.11,107.7,8.07ZM42.45,65.69C36.18,65.69,31,60,31,53s5-12.74,11.43-12.74S54,46,53.89,53,48.84,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.25,60,73.25,53s5-12.74,11.44-12.74S96.23,46,96.12,53,91.08,65.69,84.69,65.69Z"/>
      </svg>
      Mit Discord anmelden
    </a>
    <div class="footer-note">Resell Tracker · Nur für autorisierte Nutzer</div>
  </div>
</body>
</html>
